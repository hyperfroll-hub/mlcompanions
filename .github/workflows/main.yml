name: Build mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlcompanions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
      - name: Build
        env:
          VERSION: 1.0.0
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mlcompanions-mod
          path: mlcompanions/build/libs/mlcompanions-1.0.0.jar
